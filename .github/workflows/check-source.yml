name: Verify public recruitment connection
on:
  push:
    paths: ['.github/workflows/check-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public collector
        run: git clone --depth 1 https://github.com/ssin77460/youngjin-public-job-collector collector
      - name: Verify current company ads
        working-directory: collector
        run: |
          node --input-type=module -e "import {collectFindjobJobs} from './findjob.mjs'; const r=await collectFindjobJobs({});console.log(JSON.stringify({rawCount:r.rawCount,uniqueCount:r.jobs.length}));"
